<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C21"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>

    <!-- Warm Electric Orange Gradient -->
    <linearGradient id="orangeSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="100%" stop-color="#E04C00"/>
    </linearGradient>

    <!-- Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6A21" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF6A21" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- iOS / Mobile App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#obsidianBg)"/>

  <!-- Ambient Glow Core -->
  <circle cx="256" cy="256" r="190" fill="url(#centerGlow)"/>

  <!-- Geometric Financial Radar / Concentric Lines -->
  <g opacity="0.28" stroke="#606675" stroke-width="2.5" fill="none">
    <path d="M 80,256 A 176,176 0 0,1 256,80" />
    <path d="M 115,256 A 141,141 0 0,1 256,115" />
    <path d="M 150,256 A 106,106 0 0,1 256,150" />

    <path d="M 432,256 A 176,176 0 0,1 256,432" />
    <path d="M 397,256 A 141,141 0 0,1 256,397" />
    <path d="M 362,256 A 106,106 0 0,1 256,362" />
  </g>

  <!-- Outer Orange Geometric Spark (Ref Image Style) -->
  <path d="M 256,110 Q 256,256 402,256 Q 256,256 256,402 Q 256,256 110,256 Q 256,256 256,110 Z" fill="url(#orangeSpark)"/>

  <!-- Inner Cream / Off-White Core -->
  <path d="M 256,185 Q 256,256 327,256 Q 256,256 256,327 Q 256,256 185,256 Q 256,256 256,185 Z" fill="#FAF6F0"/>
</svg>
